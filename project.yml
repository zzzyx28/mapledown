name: MapleDown
options:
  bundleIdPrefix: io.github.zzzyx28
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.4.3"
    CURRENT_PROJECT_VERSION: "26"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: "$(TARGET_NAME)"
    ENABLE_HARDENED_RUNTIME: "NO"
packages:
  MarkdownEditorKit:
    url: https://github.com/yeduk3/MarkdownEditorKit.git
    from: 1.1.1
targets:
  MapleDown:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
          - "Resources/web"
      - path: App/Resources/web
        type: folder
        buildPhase: resources
      # MIT requires these notices to travel with redistributed copies of the app.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zzzyx28.mapledown
        INFOPLIST_FILE: App/Info.plist
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug uses a separate bundle id so local/Xcode builds in DerivedData never
        # share io.github.zzzyx28.mapledown with the installed /Applications release. Same-id duplicates
        # make pkd reject one Quick Look plug-in (silently killing preview) and let
        # Launch Services flip the .md handler to a transient build copy.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.zzzyx28.mapledown.debug
    dependencies:
      - target: QuickLookExtension
        embed: true
      - package: MarkdownEditorKit
  QuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
      - path: App/Shared/WebResources.swift
      - path: App/Shared/LocalImageEmbedder.swift
      - path: App/Resources/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zzzyx28.mapledown.QuickLookExtension
        PRODUCT_MODULE_NAME: QuickLookExtension
        INFOPLIST_FILE: QuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook.entitlements
      configs:
        # Must stay prefixed by the host app id (io.github.zzzyx28.mapledown.debug) for Debug.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.zzzyx28.mapledown.debug.QuickLookExtension
